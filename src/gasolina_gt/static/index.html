<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#132b29">
<meta name="description" content="Una máquina lee fotos de bombas de gasolina en Guatemala y predice si el precio sube o baja la semana siguiente. OCR + pipeline medallón + modelo de clasificación + API.">
<title>Gasolina GT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 44%22%3E%3Cpath d=%22m20 2 17 10v20L20 42 3 32V12Z%22 fill=%22%23132b29%22/%3E%3Cpath d=%22m20 11 9 5v12l-9 5-9-5V16Z%22 fill=%22%2391d9bb%22/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6f5;--paper:#fff;--ink:#14292c;--muted:#61767a;--line:#e3eae8;--green:#11796b;--green-2:#0b5e53;--mint:#91d9bb;--nav:#132b29;--red:#b4473f;--radius:18px;--shadow:0 6px 24px #12302b0d}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #59baa5;outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;background:#132b29f2;backdrop-filter:blur(10px);color:#cfe5dc}
.top .wrap{display:flex;align-items:center;gap:22px;height:62px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:650;font-size:18px;letter-spacing:-.3px;white-space:nowrap}
.brand svg{width:26px;height:28px;color:var(--mint)}
.links{display:flex;gap:4px;margin-left:auto}
.links a{text-decoration:none;font-size:13px;padding:7px 11px;border-radius:8px;color:#b8d2c8}
.links a:hover{background:#ffffff12;color:#fff}
.lang{display:flex;background:#ffffff14;border-radius:9px;padding:3px}
.lang button{border:0;background:transparent;color:#a9c4ba;font-size:12px;font-weight:650;padding:5px 10px;border-radius:7px}
.lang button[aria-pressed=true]{background:#fff;color:var(--nav)}
.gh{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:#cfe5dc}
.gh:hover{background:#ffffff14}.gh svg{width:20px;height:20px}
.hero{background:radial-gradient(1200px 500px at 85% -10%,#1f4a43 0,transparent 60%),var(--nav);color:#e6f2ee;padding:64px 0 72px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:52px;align-items:center}
.eyebrow{text-transform:uppercase;letter-spacing:1.8px;font-size:11px;font-weight:700;color:var(--mint);margin:0 0 14px}
h1{font-size:46px;line-height:1.08;letter-spacing:-1.6px;margin:0 0 18px;font-weight:700;color:#fff}
.lede{font-size:17px;color:#b7cfc6;margin:0 0 28px;max-width:540px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:30px;max-width:560px}
.kpi{background:#ffffff0d;border:1px solid #ffffff17;border-radius:14px;padding:13px 14px}
.kpi strong{display:block;font-size:24px;letter-spacing:-.6px;color:#fff;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:#9fbab0;line-height:1.35;display:block;margin-top:2px}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:11px 16px;font-size:13.5px;font-weight:650;text-decoration:none;border:1px solid transparent;white-space:nowrap;background:none}
.btn.primary{background:var(--mint);color:var(--nav)}.btn.primary:hover{background:#a9e5cb}
.btn.ghost{border-color:#ffffff33;color:#e6f2ee}.btn.ghost:hover{background:#ffffff10}
.btn.light{background:#fff;border-color:var(--line);color:var(--ink)}.btn.light:hover{background:#f6f9f8}
.btn.small{padding:6px 11px;font-size:12px;border-radius:8px}
.btn.green{background:var(--green);color:#fff}.btn.green:hover{background:var(--green-2)}
.stage-card{background:#0d1f1d;border:1px solid #ffffff1a;border-radius:20px;padding:12px;box-shadow:0 30px 80px #00000055;max-width:420px;margin-left:auto}
.stage{position:relative;border-radius:12px;overflow:hidden;background:#0a1716;line-height:0}
.stage img{width:100%;height:auto;display:block}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.scan{position:absolute;left:0;right:0;height:22%;top:-22%;background:linear-gradient(180deg,transparent,#91d9bb40 70%,#91d9bbcc 100%);pointer-events:none}
.play .scan{animation:scan 1.6s ease-in-out .2s 1 both}
@keyframes scan{0%{top:-22%;opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
.box{fill:none;stroke-width:2.5px;vector-effect:non-scaling-stroke;opacity:0}
.raw{fill:#ffffff18;stroke:#14292cb0;stroke-width:1px;vector-effect:non-scaling-stroke}
.play .box{animation:fade2 .45s ease both}
.tag{position:absolute;transform:translate(-2px,-100%);font:700 10.5px/1.1 ui-monospace,Menlo,monospace;color:#fff;padding:4px 6px;border-radius:5px 5px 5px 0;white-space:nowrap;opacity:0;margin-top:-3px}
.play .tag{animation:fade2 .35s ease both}
@keyframes fade2{from{opacity:0}to{opacity:1}}
.readout{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:12px}
.reads{display:grid;gap:6px}
.read{display:flex;justify-content:space-between;align-items:center;background:#ffffff0b;border:1px solid #ffffff14;border-radius:9px;padding:7px 10px;font-size:12.5px;color:#cfe3dc;opacity:0}
.read b{font:700 14px ui-monospace,Menlo,monospace;color:#fff}
.read i{width:8px;height:8px;border-radius:3px;display:inline-block;margin-right:7px;background:var(--c)}
.play .read{animation:slide .4s ease both}
@keyframes slide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.arrow{color:#6f9a8e;font-size:22px;opacity:0}.play .arrow{animation:fade2 .4s ease both}
.verdict{background:linear-gradient(150deg,#1d4a42,#173b35);border:1px solid #91d9bb40;border-radius:12px;padding:12px 13px;opacity:0}
.play .verdict{animation:slide .5s ease both}
.verdict small{display:block;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#91d9bb;font-weight:700}
.verdict strong{display:block;font-size:20px;color:#fff;margin:3px 0 1px}
.verdict span{font-size:11.5px;color:#a9c4ba}
.stage-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11.5px;color:#86a69c;gap:10px}
.replay{background:transparent;border:1px solid #ffffff26;color:#cfe3dc;border-radius:7px;padding:4px 9px;font-size:11.5px;white-space:nowrap}
section.block{padding:72px 0 8px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:26px;flex-wrap:wrap}
.head h2{font-size:31px;letter-spacing:-1px;line-height:1.15;margin:0 0 8px}
.head p{margin:0;color:var(--muted);max-width:660px}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--green);font-weight:700;margin-bottom:8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:5px 11px;font-size:12px;font-weight:650;background:#edf2f1;color:#4d6266;white-space:nowrap}
.pill.ok{background:#e4f4ea;color:#23704b}.pill.bad{background:#fbe9e7;color:#a5392f}
.ocr{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:20px;align-items:start}
.viewer{padding:14px}
.viewer .stage{background:#e9eeec;width:fit-content;max-width:100%;margin:0 auto}
.viewer .stage img{max-height:620px;width:auto;max-width:100%}
.viewer .tag,.viewer .box{opacity:1}
.viewer-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px 2px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--green);width:16px;height:16px}
.nav-btns{display:flex;gap:6px}
.side{padding:22px}
.side h3{font-size:18px;margin:0 0 4px;letter-spacing:-.3px}
.meta{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.rtable{width:100%;border-collapse:collapse;font-size:13.5px}
.rtable th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:0 0 8px;border-bottom:1px solid var(--line)}
.rtable td{padding:11px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.rtable td.n{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.ok-ic{color:#1f7a4f;font-weight:800}.no-ic{color:var(--red);font-weight:800}
.fuel{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.fuel i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.note{margin-top:12px;background:#f3f8f6;border:1px solid #e1ece8;border-radius:10px;padding:11px 12px;font-size:12.5px;color:#4d6662}
.note b{color:var(--ink)}
.thumbs{display:flex;gap:9px;overflow-x:auto;padding:16px 2px 6px}
.thumb{flex:0 0 auto;width:78px;border:2px solid transparent;background:#fff;border-radius:11px;padding:3px;position:relative}
.thumb img{width:100%;height:96px;object-fit:cover;border-radius:8px;display:block}
.thumb[aria-current=true]{border-color:var(--green)}
.thumb span{position:absolute;right:6px;bottom:6px;font-size:10px;font-weight:700;background:#0d1f1dcc;color:#fff;border-radius:5px;padding:1px 5px}
.thumb span.full{background:#1f7a4fdd}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.stat{padding:16px 18px}.stat strong{display:block;font-size:26px;letter-spacing:-.8px}.stat span{font-size:12.5px;color:var(--muted)}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
.price{padding:20px 22px}
.price .v{font-size:36px;font-weight:700;letter-spacing:-1.3px;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.price .v small{font-size:18px;color:var(--muted);font-weight:500;margin-right:3px}
.price .u{font-size:12px;color:var(--muted)}
.price .d{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:12.5px;font-weight:650}
.down{color:#1f7a4f}.up{color:var(--red)}
.chart-card{padding:20px 22px}
.chart-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px}
.legend button{border:0;background:none;display:flex;align-items:center;gap:6px;padding:3px 0;color:var(--muted)}
.legend button[aria-pressed=false]{opacity:.35}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.key{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.key .l{width:16px;height:2.5px;background:#7d9295;border-radius:2px}.key .d{width:9px;height:9px;border:2px solid #7d9295;border-radius:50%;margin-left:8px}
.seg{display:flex;background:#eef3f1;border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12px;border-radius:7px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 4px #0001}
.chart{height:300px}.chart svg{width:100%;height:100%;overflow:visible}
.chart text{font:11px system-ui,sans-serif;fill:#8a9c9f}.chart .grid{stroke:#e9efed;stroke-dasharray:3 4}
.model{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:20px}
.next,.bt{padding:22px;min-width:0}
.next-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.dir{font-weight:700;font-size:15px;text-align:right}.dir.baja{color:#1f7a4f}.dir.sube{color:var(--red)}.dir.se_mantiene{color:#5a6e72}
.prob{font-size:12px;color:var(--muted);text-align:right}
.bars{margin-top:18px;display:grid;gap:14px}
.bar-l{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:5px;flex-wrap:wrap}
.bar{height:9px;background:#eef3f1;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;border-radius:9px;background:var(--green)}
.bar.base span{background:#b9c8c3}
.grid-bt{display:grid;gap:6px;margin-top:16px;overflow-x:auto;padding-bottom:4px}
.bt-row{display:grid;grid-template-columns:84px repeat(10,minmax(34px,1fr));gap:6px;align-items:center;min-width:480px}
.cell{height:40px;border-radius:9px;display:grid;place-items:center;font-size:15px;font-weight:700;position:relative;cursor:default}
.cell.hit{background:#e1f3e8;color:#1f7a4f}.cell.miss{background:#fbe7e4;color:var(--red)}
.cell small{position:absolute;bottom:1px;font-size:9px;font-weight:600;opacity:.7}
.bt-head{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2}
.bt-sum{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.tip{position:fixed;z-index:50;background:#10221f;color:#e6f2ee;font-size:12px;padding:8px 10px;border-radius:8px;pointer-events:none;max-width:240px;box-shadow:0 8px 30px #0003;line-height:1.5}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.step{padding:18px 16px;position:relative}
.step:not(:last-child):after{content:"→";position:absolute;right:-12px;top:40px;color:#9db2ab;font-size:16px;z-index:2}
.step .n{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--green)}
.step h4{margin:6px 0 6px;font-size:15px}
.step p{margin:0 0 12px;font-size:12.5px;color:var(--muted);line-height:1.5}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:650;background:#eef4f2;color:#3f5b55;border-radius:6px;padding:3px 7px}
.api{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;padding:20px}
.ep{display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.ep:last-child{border:0}
.verb{font:700 10px ui-monospace,Menlo,monospace;background:#e3f2ec;color:#16664f;border-radius:5px;padding:3px 6px}
.ep code{font:12.5px ui-monospace,Menlo,monospace;overflow-wrap:anywhere}
.ep .desc{grid-column:2;font-size:12px;color:var(--muted)}
.ep .acts{grid-row:1/3;grid-column:3;display:flex;gap:6px}
.ep.on code{color:var(--green)}
.out{background:#0f201e;border-radius:14px;display:flex;flex-direction:column;min-height:340px;overflow:hidden}
.out-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #ffffff14}
.out-h code{font:12px ui-monospace,Menlo,monospace;color:#9fd8c3;overflow-wrap:anywhere}
.out pre{margin:0;padding:14px;color:#d8e6e1;font:12px/1.55 ui-monospace,Menlo,monospace;overflow:auto;max-height:440px;flex:1;white-space:pre-wrap;word-break:break-word}
footer{margin-top:80px;background:var(--nav);color:#9fbab0;padding:36px 0;font-size:13px}
footer .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer a{color:#cfe5dc}
.toast{position:fixed;right:20px;bottom:20px;background:#10221f;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;z-index:60}
.loading{color:var(--muted);font-size:13px;padding:30px;text-align:center;line-height:1.5}
@media(max-width:1020px){.hero .wrap{grid-template-columns:1fr;gap:36px}.stage-card{margin:0 auto}.ocr,.model,.api{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}.step:after{display:none}.links{display:none}.lang{margin-left:auto}}
@media(max-width:640px){.wrap{padding:0 16px}h1{font-size:33px;letter-spacing:-1px}.lede{font-size:15.5px}.kpis{gap:8px}.kpi{padding:10px}.kpi strong{font-size:19px}.kpi span{font-size:10.5px}.hero{padding:40px 0 48px}.prices,.summary{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.head h2{font-size:25px}.readout{grid-template-columns:1fr}.arrow{display:none}.chart{height:240px}.ep{grid-template-columns:auto 1fr}.ep .acts{grid-row:auto;grid-column:1/3}.top .wrap{gap:12px}.viewer .stage img{max-height:480px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>

<main>
<section class="block" id="ocr"><div class="wrap">
  <div class="head"><div><div class="kicker" data-i18n="ocr_k"></div><h2 data-i18n="ocr_h"></h2><p data-i18n="ocr_p"></p></div></div>
  <div class="summary">
    <div class="card stat"><strong id="s-correct">—</strong><span data-i18n="s_correct"></span></div>
    <div class="card stat"><strong id="s-full">—</strong><span data-i18n="s_full"></span></div>

    <div class="card viewer">
      <div class="stage" id="viewer"></div>
      <div class="viewer-bar">
        <label class="toggle"><input type="checkbox" id="raw"><span data-i18n="raw"></span></label>

      </div>
    </div>
    <div class="card side" id="side"><div class="loading" data-i18n="loading"></div></div>
  </div>
  <div class="thumbs" id="thumbs"></div>

function applyLang(){

const correct=(f,c)=>f.reales[c]!=null&&f.leidos[c]!=null&&Math.abs(f.leidos[c]-f.reales[c])<.005;

function stageHTML(f,{raw=false,anim=false}={}){
  const boxes=f.precios.map((p,i)=>{const [x1,y1,x2,y2]=p.caja;return `<rect class="box" x="${x1}" y="${y1}" width="${x2-x1}" height="${y2-y1}" stroke="${COLOR[p.combustible]}" style="animation-delay:${anim?1.5+i*.35:0}s"/>`;}).join('');
  const raws=raw?f.crudas.map(d=>{const [x1,y1,x2,y2]=d.caja;return `<rect class="raw" x="${x1}" y="${y1}" width="${x2-x1}" height="${y2-y1}"><title>${esc(d.texto)}</title></rect>`;}).join(''):'';

function renderHero(){

}
$('replay').addEventListener('click',renderHero);

function renderGallery(){
  if(!S.fotos.length)return;

  $('viewer').innerHTML=stageHTML(f,{raw:$('raw').checked});

    return `<tr><td>${fuelTag(c)}</td><td class="n">${f.leidos[c]!=null?'Q'+q2(f.leidos[c]):'<span style="color:var(--muted);font-weight:400">'+t('miss')+'</span>'}</td><td class="n">${has?'Q'+q2(f.reales[c]):'—'}</td><td style="text-align:right">${has?(ok?'<span class="ok-ic">✓</span>':'<span class="no-ic">✗</span>'):''}</td></tr>`;}).join('');
  const notes=f.precios.map(p=>{const v={f:t(p.combustible),o:q2(p.ocr),v:q2(p.valor)};
    if(p.fuente==='corregido_por_ruta_A')return t('fix_a',v);if(p.fuente==='corregido_por_reglas')return t('fix_r',v);if(p.fuente==='inferido')return t('inf',v);return '';}).filter(Boolean);
  $('side').innerHTML=`<h3>${esc(t('photo_of',{d:fdate(f.fecha,{day:'numeric',month:'long',year:'numeric'})}))}</h3>

    <table class="rtable"><thead><tr><th>${t('th_fuel')}</th><th>${t('th_read')}</th><th>${t('th_real')}</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    ${Object.keys(f.reales).length?'':`<div class="note">${t('no_label')}</div>`}
    ${notes.map(n=>`<div class="note">${n}</div>`).join('')}`;
  document.querySelectorAll('.thumb').forEach((b,i)=>b.setAttribute('aria-current',String(i===S.sel)));
}
function renderThumbs(){
  $('thumbs').innerHTML=S.fotos.map((f,i)=>{const n=Object.keys(f.reales).length,k=nOk(f);
    return `<button class="thumb" data-i="${i}" aria-label="${esc(t('photo_of',{d:fdate(f.fecha)}))}"><img src="/media/${esc(f.img)}" alt="" loading="lazy"><span class="${n&&k===n?'full':''}">${n?k+'/'+n:'—'}</span></button>`;}).join('');
}
function select(i){S.sel=(i+S.fotos.length)%S.fotos.length;renderGallery();const b=document.querySelector(`.thumb[data-i="${S.sel}"]`);if(b)$('thumbs').scrollTo({left:b.offsetLeft-$('thumbs').clientWidth/2+b.clientWidth/2,behavior:'smooth'});}

$('prev').addEventListener('click',()=>select(S.sel-1));$('next').addEventListener('click',()=>select(S.sel+1));
function renderOcrStats(){
  if(!S.fotos.length)return;
  let n=0,ok=0,full=0,lab=0,tms=0;
  S.fotos.forEach(f=>{const ks=Object.keys(f.reales);n+=ks.length;const k=nOk(f);ok+=k;if(ks.length){lab++;if(k===ks.length)full++;}tms+=f.tiempo_ms;});
  $('s-correct').textContent=`${ok}/${n} · ${pct(ok/n,1)}`;$('k-ocr').textContent=pct(ok/n,1);

function renderPrices(){
  if(!S.current.length)return;
  $('prices').innerHTML=FUELS.map(c=>{const p=S.current.find(x=>x.combustible===c);if(!p)return '';
    const serie=S.hist.filter(x=>x.combustible===c&&x.fuente===p.fuente).sort((a,b)=>day(a.semana_inicio).localeCompare(day(b.semana_inicio)));
    const prev=serie.filter(x=>day(x.semana_inicio)<day(p.semana_inicio)).at(-1);const d=prev?p.precio_promedio-prev.precio_promedio:null;
    return `<div class="card price">${fuelTag(c)}<div class="v"><small>Q</small>${q2(p.precio_promedio)}</div><div class="u">${t('per_gal',{d:fdate(p.semana_inicio)})}</div>${d!=null?`<div class="d ${d<0?'down':d>0?'up':''}">${d<0?'↘ −':d>0?'↗ +':''}Q${q2(Math.abs(d))} ${t('vs',{d:fdate(prev.semana_inicio,{day:'numeric',month:'short'})})}</div>`:''}</div>`;}).join('');
  $('last-week').textContent=t('last',{d:fdate(S.current[0].semana_inicio)});
}
function renderLegend(){$('legend').innerHTML=FUELS.map(c=>`<button data-c="${c}" aria-pressed="${S.vis.has(c)}"><i style="--c:${COLOR[c]}"></i>${t(c)}</button>`).join('');}
$('legend').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const c=b.dataset.c;S.vis.has(c)?S.vis.delete(c):S.vis.add(c);renderLegend();drawChart();});
$('period').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.weeks=Number(b.dataset.w);$('period').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));drawChart();});
function drawChart(){
  const all=S.hist.filter(x=>S.vis.has(x.combustible)&&Number.isFinite(ts(x.semana_inicio)));
  if(!all.length){$('chart').innerHTML='';return;}
  const last=Math.max(...all.map(x=>ts(x.semana_inicio)));const rows=all.filter(x=>!S.weeks||ts(x.semana_inicio)>=last-(S.weeks-1)*7*864e5);
  const box=$('chart'),W=Math.max(300,box.clientWidth||900),H=box.clientHeight||300,L=34,R=8,TP=12,B=28;
  const tt=rows.map(x=>ts(x.semana_inicio)),t0=Math.min(...tt),t1=Math.max(...tt),vs=rows.map(x=>x.precio_promedio);
  const lo=Math.floor(Math.min(...vs)-1),hi=Math.ceil(Math.max(...vs)+1);
  const X=v=>L+(v-t0)/(t1-t0||1)*(W-L-R),Y=v=>TP+(hi-v)/(hi-lo)*(H-TP-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t('pr_h'))}">`;
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;s+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v.toFixed(0)}</text>`;}
  for(let i=0;i<5;i++){const v=t0+(t1-t0)*i/4;s+=`<text x="${X(v)}" y="${H-6}" text-anchor="${i?i===4?'end':'middle':'start'}">${new Date(v).toLocaleDateString(loc(),{month:'short',year:'2-digit',timeZone:'UTC'})}</text>`;}
  FUELS.filter(c=>S.vis.has(c)).forEach(c=>{
    const mem=rows.filter(r=>r.combustible===c&&r.fuente==='mem').sort((a,b)=>ts(a.semana_inicio)-ts(b.semana_inicio));
    let prev=null,d='';mem.forEach(r=>{const x=ts(r.semana_inicio);d+=`${prev===null||x-prev>8*864e5?'M':'L'}${X(x).toFixed(1)},${Y(r.precio_promedio).toFixed(1)} `;prev=x;});
    if(d)s+=`<path d="${d}" fill="none" stroke="${COLOR[c]}" stroke-width="2.2" stroke-linejoin="round" opacity=".85"/>`;
    rows.filter(r=>r.combustible===c&&r.fuente==='fotos').forEach(r=>{s+=`<circle cx="${X(ts(r.semana_inicio))}" cy="${Y(r.precio_promedio)}" r="4" fill="#fff" stroke="${COLOR[c]}" stroke-width="2"><title>${t(c)} · ${fdate(r.semana_inicio)} · ${t('key_photo')}: Q${q2(r.precio_promedio)}</title></circle>`;});
  });
  $('chart').innerHTML=s+'</svg>';
}
function renderModel(){
  if(S.pred.length){$('next-week').textContent=t('target',{d:fdate(S.pred[0].semana,{day:'numeric',month:'long',year:'numeric'})});
    $('next-list').innerHTML=FUELS.map(c=>{const p=S.pred.find(x=>x.combustible===c);if(!p)return '';return `<div class="next-row">${fuelTag(c)}<div><div class="dir ${p.prediccion}">${ARROW[p.prediccion]||''} ${t(p.prediccion)}</div><div class="prob">${pct(p.probabilidad)} ${t('prob')}</div></div></div>`;}).join('');}
  const m=S.metrics;if(m){const bar=(l,a,b,f1)=>`<div><div class="bar-l"><b>${l}</b><span>${t('model')} ${f1?a.toFixed(3):pct(a)} · ${t('base')} ${f1?b.toFixed(3):pct(b)}</span></div><div class="bar"><span style="width:${a*100}%"></span></div><div class="bar base" style="margin-top:4px;height:5px"><span style="width:${b*100}%"></span></div></div>`;
    $('metrics').innerHTML=bar(t('m_acc'),m.accuracy_modelo,m.accuracy_baseline)+bar(t('m_f1'),m.f1_macro_modelo,m.f1_macro_baseline,true);
    $('k-model').textContent=pct(m.accuracy_modelo);}
  const bt=S.bt;if(!bt)return;
  const head=`<div class="bt-row"><span></span>${bt.semanas.map(w=>`<span class="bt-head">${fdate(w,{day:'numeric',month:'short'})}</span>`).join('')}</div>`;
  $('bt').innerHTML=head+FUELS.map(c=>`<div class="bt-row"><span>${fuelTag(c)}</span>${bt.semanas.map(w=>{const r=bt.detalle.find(x=>x.semana===w&&x.combustible===c);if(!r)return '<span></span>';const hit=r.real===r.modelo;
    return `<span class="cell ${hit?'hit':'miss'}" tabindex="0" data-tip="${esc(t('tip',{d:fdate(w),r:t(r.real),m:t(r.modelo),p:pct(r.prob),b:t(r.base)}))}">${hit?'✓':'✗'}<small>${ARROW[r.modelo]}</small></span>`;}).join('')}</div>`).join('');
  $('bt-sum').innerHTML=`<span class="pill ok">${t('hits',{a:bt.aciertos_modelo,n:bt.total})}</span><span class="pill">${t('hits_b',{a:bt.aciertos_linea_base,n:bt.total})}</span>`;
}
function showTip(e){const c=e.target.closest('[data-tip]');if(!c){$('tip').hidden=true;return;}$('tip').innerHTML=c.dataset.tip;$('tip').hidden=false;const r=c.getBoundingClientRect();$('tip').style.left=Math.max(8,Math.min(innerWidth-250,r.left-60))+'px';$('tip').style.top=(r.bottom+8)+'px';}
$('bt').addEventListener('mouseover',showTip);$('bt').addEventListener('focusin',showTip);$('bt').addEventListener('mouseleave',()=>$('tip').hidden=true);$('bt').addEventListener('focusout',()=>$('tip').hidden=true);
const EPS=[['/health','e1'],['/precios/actual','e2'],['/precios?combustible=diesel&desde=2026-10-01&limit=5','e3'],['/prediccion?combustible=super','e4'],['/modelo/backtest','e5'],['/fotos','e6']];
function renderEps(){const on=document.querySelector('.ep.on')?.dataset.i;$('eps').innerHTML=EPS.map(([p,k],i)=>`<div class="ep${String(i)===on?' on':''}" data-i="${i}"><span class="verb">GET</span><code>${esc(p)}</code><span class="desc">${t(k)}</span><span class="acts"><button class="btn green small" data-a="try">${t('try')}</button><button class="btn light small" data-a="copy">${t('copy')}</button></span></div>`).join('');}
$('eps').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const row=b.closest('.ep'),p=EPS[row.dataset.i][0],url=location.origin+p;
  if(b.dataset.a==='copy'){try{await navigator.clipboard.writeText(`curl "${url}"`);toast(t('copied'));}catch{toast(`curl "${url}"`);}return;}
  document.querySelectorAll('.ep').forEach(r=>r.classList.toggle('on',r===row));$('out-url').textContent='GET '+url;$('out-st').className='pill';$('out-st').textContent='…';
  const t0=performance.now();try{const r=await fetch(p);const j=await r.json();$('out-st').className='pill '+(r.ok?'ok':'bad');$('out-st').textContent=`HTTP ${r.status} · ${Math.round(performance.now()-t0)} ms`;
    let txt=JSON.stringify(j,null,2);if(txt.length>6000)txt=txt.slice(0,6000)+'\n…';$('out').textContent=txt;}catch(err){$('out-st').className='pill bad';$('out-st').textContent='Error';$('out').textContent=String(err);}});
function renderAll(){renderHero();renderOcrStats();renderThumbs();renderGallery();renderPrices();renderLegend();drawChart();renderModel();renderEps();
  $('snap').textContent=t('snapshot',{d:fdate(S.health?.instantanea,{day:'numeric',month:'long',year:'numeric'})});}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(drawChart,150);});
async function load(){
  const jobs={health:api('/health'),current:api('/precios/actual'),hist:api('/precios?limit=1000'),pred:api('/prediccion'),metrics:api('/modelo/metricas'),bt:api('/modelo/backtest'),fotos:api('/fotos?detalle=true')};
  const res=await Promise.allSettled(Object.values(jobs));const k=Object.keys(jobs);let fail=false;
  res.forEach((r,i)=>{if(r.status!=='fulfilled'){fail=true;return;}const v=r.value;
    ({health:()=>S.health=v,current:()=>S.current=v.precios||[],hist:()=>S.hist=v.datos||[],pred:()=>S.pred=v.predicciones||[],metrics:()=>S.metrics=v,bt:()=>S.bt=v,fotos:()=>S.fotos=(v.fotos||[]).sort((a,b)=>day(a.fecha).localeCompare(day(b.fecha)))})[k[i]]();});
  if(S.fotos.length){const cand=S.fotos.filter(f=>f.precios.length>=3&&Object.keys(f.reales).length===3&&nOk(f)===3);S.hero=cand.at(-1)||S.fotos.at(-1);S.sel=S.fotos.indexOf(S.hero);}
  applyLang();if(fail)toast(t('err'));
}
applyLang();load();
</script>
